name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance: attests that this tarball was built from this repository
  # by this workflow, which npm shows on the package page.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release notes are whatever CHANGELOG.md already says about this
      # version. Writing them twice is how the two drift apart.
      - name: Extract the changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          # From this version's heading to the next one, minus the heading itself.
          # `index` rather than a regex match: the heading contains [ and ],
          # which a regex would read as a character class and never match.
          awk -v v="## [${version}]" '
            index($0, v) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            # Link reference definitions live at the foot of the file and
            # belong to no release.
            found && /^\[[^]]+\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "The ${version} section of CHANGELOG.md is empty" >&2
            exit 1
          fi
          {
            echo ""
            echo "\`\`\`bash"
            echo "npx -y @yakupemreyerli/firefly-mcp"
            echo "\`\`\`"
            echo ""
            echo "**Docs:** https://yakupemreyerli.github.io/mcp-firefly-iii/"
            echo "**npm:** https://www.npmjs.com/package/@yakupemreyerli/firefly-mcp"
          } >> release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Refuse to publish a version that does not match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag is v$tag but package.json says $manifest." >&2
            echo "Publishing would put the wrong version on npm under this tag." >&2
            exit 1
          fi
          # server.json is what the MCP Registry serves, and it names the npm
          # version separately from its own. A copy left behind would publish a
          # registry entry pointing at a release that is not this one — which
          # is worse than not publishing, because it looks current.
          server="$(node -p "require('./server.json').version")"
          package="$(node -p "require('./server.json').packages[0].version")"
          if [ "$tag" != "$server" ] || [ "$tag" != "$package" ]; then
            echo "Tag is v$tag but server.json says $server (package $package)." >&2
            exit 1
          fi

      - name: Check npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          version="$(npm --version)"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          if [ "$major" -lt 11 ] || { [ "$major" -eq 11 ] && [ "$minor" -lt 5 ]; }; then
            echo "npm $version is too old for trusted publishing; need >= 11.5.1." >&2
            exit 1
          fi

      - run: npm ci

      # Published through npm trusted publishing: the registry trusts this
      # repository and workflow by name, so there is no token to leak, expire,
      # or fail an OTP prompt in CI. Provenance comes with it.
      #
      # prepublishOnly runs the typecheck, the tests and the build, so a broken
      # tree cannot reach npm even from here.
      - run: npm publish --access public

      # The MCP Registry does not follow npm. Without these three steps its
      # entry stays at whatever version was last published by hand — and it did:
      # the listing sat at 1.1.1 while releases carried on without it, which is
      # the failure this whole step exists to end. It runs after npm because the
      # registry validates that the package it points at actually exists.
      #
      # OIDC, like the npm publish above: the registry trusts this repository
      # and workflow by name, so there is no token here either.
      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
