name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # npm provenance: attests that this tarball was built from this repository
  # by this workflow, which npm shows on the package page.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release notes are whatever CHANGELOG.md already says about this
      # version. Writing them twice is how the two drift apart.
      - name: Extract the changelog section for this tag
        id: notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          # From this version's heading to the next one, minus the heading itself.
          # `index` rather than a regex match: the heading contains [ and ],
          # which a regex would read as a character class and never match.
          awk -v v="## [${version}]" '
            index($0, v) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            # Link reference definitions live at the foot of the file and
            # belong to no release.
            found && /^\[[^]]+\]: http/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "The ${version} section of CHANGELOG.md is empty" >&2
            exit 1
          fi
          {
            echo ""
            echo "\`\`\`bash"
            echo "npx -y @yakupemreyerli/firefly-mcp"
            echo "\`\`\`"
            echo ""
            echo "**Docs:** https://yakupemreyerli.github.io/mcp-firefly-iii/"
            echo "**npm:** https://www.npmjs.com/package/@yakupemreyerli/firefly-mcp"
          } >> release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Refuse to publish a version that does not match the tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag is v$tag but package.json says $manifest." >&2
            echo "Publishing would put the wrong version on npm under this tag." >&2
            exit 1
          fi

      - name: Check the publish token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "NPM_TOKEN is not set on this repository." >&2
            echo "Create a granular access token with publish rights at" >&2
            echo "https://www.npmjs.com/settings/yakupemreyerli/tokens and add it with:" >&2
            echo "  gh secret set NPM_TOKEN" >&2
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs the typecheck, the tests and the build; a broken
      # tree cannot reach npm even from here.
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
