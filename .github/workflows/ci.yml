name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.6 is the floor the package declares; 22 is current LTS.
        node-version: ["20.6", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Build before test: the docs generator's own tests import the compiled
      # registry from dist/, the one artifact this pipeline treats as ground
      # truth, and CI starts from a clean checkout with no dist/ yet.
      - run: npm run build
      - run: npm test
      - run: npm run docs:check

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pack, install the tarball into a clean directory, and start both
      # binaries. A package that passes its tests can still be unusable if a
      # runtime dependency sits in devDependencies or `files` misses something.
      - name: Install the packed tarball and start both binaries
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --omit=dev "$GITHUB_WORKSPACE/$tarball"
          export FIREFLY_API_URL=https://firefly.invalid/api/v1
          export FIREFLY_API_TOKEN=not-a-real-token
          # stdio server: answers tools/list and exits when stdin closes.
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./node_modules/.bin/firefly-mcp > /tmp/stdio-tools.json
          for tool in firefly_query firefly_mutate firefly_destructive; do
            grep -q "$tool" /tmp/stdio-tools.json || { echo "the stdio server did not serve $tool" >&2; exit 1; }
          done
          # The split is only worth anything if the tool that could do
          # everything is actually gone.
          if grep -q firefly_execute /tmp/stdio-tools.json; then
            echo "the stdio server still serves firefly_execute" >&2
            exit 1
          fi
          # HTTP server: must refuse to start without a token.
          if ./node_modules/.bin/firefly-mcp-http 2>/dev/null; then
            echo "HTTP server started without MCP_HTTP_TOKEN" >&2
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image had a Dockerfile that contradicted .dockerignore and nobody
      # noticed, because nothing ever built it. Building is not enough on its
      # own either: an image that builds can still refuse to serve.
      - run: docker build -t firefly-mcp:ci .
      - name: Start it and check both the refusal and the served surface
        run: |
          set -euo pipefail
          # No MCP_HTTP_TOKEN: must refuse rather than listen unauthenticated.
          if docker run --rm -e FIREFLY_API_URL=https://firefly.invalid/api/v1 \
               -e FIREFLY_API_TOKEN=x firefly-mcp:ci 2>/dev/null; then
            echo "Container started without MCP_HTTP_TOKEN" >&2
            exit 1
          fi

          docker run -d --name ffmcp -p 3000:3000 \
            -e FIREFLY_API_URL=https://firefly.invalid/api/v1 \
            -e FIREFLY_API_TOKEN=x \
            -e MCP_HTTP_HOST=0.0.0.0 \
            -e MCP_HTTP_TOKEN=ci-token firefly-mcp:ci

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done

          curl -sf http://127.0.0.1:3000/health | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/mcp)" = "401"
          curl -s -X POST http://127.0.0.1:3000/mcp \
            -H "Authorization: Bearer ci-token" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            > /tmp/http-tools.json
          for tool in firefly_query firefly_mutate firefly_destructive; do
            grep -q "$tool" /tmp/http-tools.json || { echo "the container did not serve $tool" >&2; exit 1; }
          done
          if grep -q firefly_execute /tmp/http-tools.json; then
            echo "the container still serves firefly_execute" >&2
            exit 1
          fi

          docker rm -f ffmcp > /dev/null
