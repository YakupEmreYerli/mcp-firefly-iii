name: Feature request
description: Suggest an operation, option, or behaviour
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The question you want answered or the task you want done, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: Firefly III endpoint
      description: If this maps to a Firefly III API endpoint, which one?
      placeholder: "GET /api/v1/insight/expense/asset"
