services:
  firefly-mcp:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 3000
      MCP_AUTH_PASSWORD: change-this-to-a-long-password
      MCP_AUTH_STATE_DIR: /data/firefly-mcp-auth
      MCP_RESOURCE_URL: https://mcp.example.com
    volumes:
      - firefly-mcp-auth:/data/firefly-mcp-auth
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - firefly-mcp
  caddy:
    image: caddy:2-alpine
    profiles: [caddy]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - firefly-mcp

volumes:
  firefly-mcp-auth:
  caddy-data:
  caddy-config:
